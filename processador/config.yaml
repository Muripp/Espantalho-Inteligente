# Configuração do processador NO PC. (No Raspberry Pi: config_pi.yaml)
# Todas as opções: README.md, seção 12.

dispositivo: pi-campo-1
modelo: modelos/espantalho_aves.onnx
respostas: respostas.yaml
log: INFO

fonte:
  tipo: webapp            # webapp (botão "Testar pasta" do dashboard) | pasta | webcam | picamera
  # pasta: ../fotos_teste # se tipo = pasta
  # modo: camera         # se tipo = pasta: camera (finge ser a câmera) | teste
  # camera: 0             # se tipo = webcam

canal_esp32:
  tipo: webapp            # webapp (ESP32 virtual no dashboard) | vazio | serial | mqtt
  # portas: { torre1: COM5 }   # se tipo = serial (ESP32 de verdade ligado no PC)

memoria:                  # registro próprio do Pi (funciona sem rede)
  pasta: memoria          # memoria/eventos.jsonl + memoria/fotos/
  salvar_foto: true
  max_fotos: 5000         # apaga as fotos mais velhas depois disso (o .jsonl fica)
  intervalo_aguardando_s: 10   # bicho parado: no máximo 1 registro "aguardando" por animal a cada 10 s

webapp:
  ativado: true           # false = o Pi não manda nada pro dashboard (só ESP32 + memória)
  url: http://localhost:8000
  enviar_foto: so_com_animal   # so_com_animal | sempre | nunca  (teste de pasta: sempre manda)
