# O que fazer com cada animal.  Vault: "04 ESP32/Respostas por animal"
#
#   REGRA (por animal)  ->  RESPOSTA (receita com nome)  ->  AÇÕES (o que o ESP32 faz)
#
# Cada passo: { esp32: <nome do ESP32>, acao: <ação>, params: {...} }
# Ações que o ESP32 vai saber fazer: som, rele, led, servo, parar
# Os números em `respostas` de cada regra são PESOS do sorteio
# (ave: predador 3, sirene 1  => 3 de cada 4 vezes usa "predador").

versao: 1

respostas:
  predador:
    - { esp32: torre1, acao: som, params: { faixa: 3, volume: 85, duracao_ms: 4000 } }
    - { esp32: torre1, acao: led, params: { padrao: estrobo, duracao_ms: 4000 } }
  sirene:
    - { esp32: torre1, acao: som, params: { faixa: 7, volume: 100, duracao_ms: 5000 } }
  latido:
    - { esp32: torre1, acao: som, params: { faixa: 5, volume: 90, duracao_ms: 3000 } }
  luz:
    - { esp32: torre1, acao: led, params: { padrao: pisca, duracao_ms: 5000 } }

regras:
  ave:      { confianca_min: 0.35, cooldown_s: 30, respostas: { predador: 3, sirene: 1 } }
  porco:    { confianca_min: 0.45, cooldown_s: 20, respostas: { sirene: 1, latido: 1 } }
  cachorro: { cooldown_s: 30, respostas: { sirene: 1 } }
  cavalo:   { cooldown_s: 60, respostas: { luz: 1 } }
  vaca:     { cooldown_s: 60, respostas: { luz: 1 } }
  rato:     { cooldown_s: 20, respostas: { luz: 1 } }
  gato:     { cooldown_s: 60, respostas: { latido: 1 } }
  padrao:   { cooldown_s: 30, respostas: { sirene: 1 } }   # outro_animal e qualquer classe sem regra
  pessoa:   { bloqueia_tudo: true }

padroes:                # valem quando a regra não diz
  confianca_min: 0.45
  validade_ms: 2000
